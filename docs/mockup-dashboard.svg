  <rect x="812" y="278" width="360" height="22" fill="#1f2937"/>
  <text x="832" y="284" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="white">Treasury Flow</text>

  <!-- Mini chart -->
  <polyline points="832,460 872,440 912,420 952,430 992,400 1032,380 1072,360 1112,340 1152,320" stroke="#6366f1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="832,460 872,440 912,420 952,430 992,400 1032,380 1072,360 1112,340 1152,320 1152,480 832,480" fill="#6366f1" opacity="0.12"/>
