  <text x="52" y="192" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="white">12,500</text>
  <text x="175" y="192" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280"> XLM</text>
  <text x="52" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#34d399">▲ +2.4% this week</text>

  <!-- Card 2 -->
  <rect x="322" y="134" width="270" height="100" rx="12" fill="url(#cardGrad)" stroke="#1f2937" stroke-width="1"/>
  <text x="342" y="160" font-family="system-ui,sans-serif" font-size="12" fill="#6b7280">Active Streams</text>
  <text x="342" y="192" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="white">8</text>
