  <text x="832" y="498" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">Mon</text>
  <text x="912" y="498" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">Tue</text>
  <text x="992" y="498" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">Wed</text>
  <text x="1072" y="498" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">Thu</text>
  <text x="1140" y="498" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">Fri</text>
  <text x="832" y="320" font-family="system-ui,sans-serif" font-size="10" fill="#4b5563">12,500 XLM</text>

  <!-- Bottom bar -->
