  <text x="632" y="192" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="white">48,200</text>
  <text x="762" y="192" font-family="system-ui,sans-serif" font-size="14" fill="#6b7280"> XLM</text>
  <text x="632" y="218" font-family="system-ui,sans-serif" font-size="12" fill="#34d399">▲ +320 XLM today</text>

