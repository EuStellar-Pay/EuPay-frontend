  <text x="52" y="358" font-family="monospace" font-size="12" fill="#6b7280">STR-001</text>
  <text x="172" y="358" font-family="system-ui,sans-serif" font-size="13" fill="white">Alice M.</text>
  <text x="322" y="358" font-family="system-ui,sans-serif" font-size="13" fill="#818cf8">10 XLM/hr</text>
  <rect x="442" y="344" width="64" height="20" rx="10" fill="#064e3b"/>
