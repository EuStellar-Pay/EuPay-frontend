  <rect x="32" y="376" width="760" height="44" fill="#0d1117"/>
  <text x="52" y="402" font-family="monospace" font-size="12" fill="#6b7280">STR-002</text>
  <text x="172" y="402" font-family="system-ui,sans-serif" font-size="13" fill="white">Bob K.</text>
  <text x="322" y="402" font-family="system-ui,sans-serif" font-size="13" fill="#818cf8">8 XLM/hr</text>
  <rect x="442" y="388" width="64" height="20" rx="10" fill="#064e3b"/>
