  <text x="32" y="737" font-family="system-ui,sans-serif" font-size="11" fill="#374151">EuPay • Stellar Testnet • Block #8,472,110</text>
  <text x="1100" y="737" font-family="system-ui,sans-serif" font-size="11" fill="#374151">v0.1.0</text>

  <!-- Watermark label -->
  <rect x="480" y="360" width="120" height="28" rx="6" fill="#4f46e5" opacity="0.15"/>
  <text x="540" y="379" font-family="system-ui,sans-serif" font-size="11" fill="#818cf8" text-anchor="middle" opacity="0.7">UI Preview</text>
