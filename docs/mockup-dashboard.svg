  <rect x="0" y="48" width="1200" height="12" fill="#111827"/>
  <rect x="0" y="56" width="1200" height="4" fill="#1f2937"/>

  <!-- Logo -->
  <text x="32" y="38" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#818cf8">EuPay</text>
  <text x="108" y="36" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Dashboard</text>
  <text x="108" y="50" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Streams</text>
  <text x="188" y="36" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Workers</text>
  <text x="188" y="50" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Treasury</text>

